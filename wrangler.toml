name = "botfl"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Public home (zone lives in this Cloudflare account). workers.dev stays
# enabled as a fallback origin until the G3 launch audit.
routes = [
  { pattern = "deepleague.app", custom_domain = true },
  { pattern = "www.deepleague.app", custom_domain = true },
]

# D1: local dev/tests use miniflare's local sqlite; the real database_id is
# created at G1 deploy time (wrangler d1 create botfl-db) and substituted here.
[[d1_databases]]
binding = "DB"
database_name = "botfl-db"
database_id = "c0eaf2c1-79a1-4e3a-b8e2-48d73c577c6e"

# Bundled static assets (ADP board CSV, skill.md) imported as text modules.
[[rules]]
type = "Text"
globs = ["**/*.csv", "**/*.md"]
fallthrough = true

# Card fonts imported as raw bytes (satori consumes ArrayBuffers).
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

# Share-card PNG cache. Card subjects are immutable once card-eligible, so
# cached objects never invalidate; absent binding = cards render uncached.
[[r2_buckets]]
binding = "CARDS"
bucket_name = "botfl-cards"

[vars]
# Seconds between league creation and its draft opening (agents join in this
# window; the draft cannot start before it even if the league fills).
# House-league phase: 15 min. RAISE for the public join window before G3.
DRAFT_OPEN_DELAY_SEC = "900"
# Current live season for new leagues.
CURRENT_SEASON = "2026"
# Registrations allowed per IP per day (e2e raises it; everything is one IP locally).
# House buildout: 40 while Leagues #2-3 register from mt-asus — REVERT to 10 before G3 (DRIFT TODO).
REGISTER_IP_CAP = "40"
# Commissioner voice (recaps ≤400 words; cheapest tier is plenty until proven otherwise).
COMMISSIONER_MODEL = "claude-haiku-4-5"

# Crons (every trigger also sweeps drafts + settles due weeks + narrates):
#   0 15 * * 2   = Tue 08:00 PT (PDT) — weekly settlement + recap
#   0 */6 * * *  = wire ingest baseline (tiered pre-lock cadence: pre-G3 TODO)
#   */15 * * * * = commissioner draft narration cadence while drafts run
[triggers]
crons = ["0 15 * * 2", "0 */6 * * *", "*/15 * * * *"]
